syntax = "proto3";

package legendary.protocol;

option java_package = "com.legendary.protocol";
option java_multiple_files = true;
option java_outer_classname = "GameProtocol";

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  UP = 1;
  DOWN = 2;
  LEFT = 3;
  RIGHT = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  OK = 1;
  INVALID_REQUEST = 2;
  NOT_AUTHENTICATED = 3;
  SERVER_BUSY = 4;
}

message LoginRequest {
  string account_name = 1;
  string client_version = 2;
}

message LoginResponse {
  ErrorCode error_code = 1;
  string account_id = 2;
  string player_id = 3;
  string session_id = 4;
}

message HeartbeatRequest {
  int64 client_time_millis = 1;
}

message HeartbeatResponse {
  int64 server_time_millis = 1;
}

message EnterSceneRequest {
  string scene_id = 1;
}

message EnterSceneResponse {
  ErrorCode error_code = 1;
  string scene_id = 2;
}

message MoveRequest {
  Direction direction = 1;
  uint32 input_sequence = 2;
}

message PlayerPositionSnapshot {
  string player_id = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 last_input_sequence = 4;
}

message SceneSnapshot {
  string scene_id = 1;
  repeated PlayerPositionSnapshot players = 2;
}
